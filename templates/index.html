<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Custom Decryptor</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
        body { background:#121212; color:#e0e0e0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .wrap { width:100%; max-width:720px; }
        .card { background:#1e1e1e; border-radius:12px; padding:32px; box-shadow:0 10px 40px rgba(0,0,0,0.4); transition:opacity 0.3s ease, transform 0.3s ease; }
        .hidden { display:none !important; }
        h1 { color:#4fc3f7; text-align:center; margin-bottom:24px; font-size:22px; }
        .group { margin-bottom:18px; }
        label { display:block; margin-bottom:6px; color:#b0bec5; font-size:14px; }
        input { width:100%; padding:12px; border:1px solid #37474f; border-radius:8px; background:#263238; color:#fff; font-size:15px; }
        input:focus { outline:none; border-color:#4fc3f7; }
        button { width:100%; padding:12px; background:#1976d2; color:white; border:none; border-radius:8px; font-size:16px; font-weight:500; cursor:pointer; transition:all 0.2s; }
        button:hover { background:#1565c0; transform:translateY(-1px); }
        button:disabled { background:#455a64; cursor:not-allowed; transform:none; }
        .err { color:#ff5252; margin:10px 0; text-align:center; font-size:14px; min-height:20px; }
        .upload { border:2px dashed #4fc3f7; border-radius:8px; padding:36px; text-align:center; margin:20px 0; cursor:pointer; transition:0.2s; }
        .upload:hover { background:#263238; border-color:#81d4fa; }
        #fileIn { display:none; }
        .fname { margin-top:10px; color:#81d4fa; font-weight:500; }
        .result { margin-top:20px; background:#263238; border-radius:8px; padding:16px; max-height:550px; overflow:auto; white-space:pre-wrap; font-family:monospace; font-size:13px; line-height:1.6; }
        .logout { background:#ef5350; margin-top:16px; }
        .logout:hover { background:#e53935; }
    </style>
</head>
<body>
<div class="wrap">
    <!-- LOGIN PAGE -->
    <div id="loginCard" class="card">
        <h1>🔐 Login Required</h1>
        <div class="group">
            <label>Username</label>
            <input type="text" id="user" autocomplete="off">
        </div>
        <div class="group">
            <label>Password</label>
            <input type="password" id="pass">
        </div>
        <div id="errMsg" class="err"></div>
        <button onclick="doLogin()">Sign In</button>
    </div>

    <!-- MAIN PAGE -->
    <div id="mainCard" class="card hidden">
        <h1>📂 HTTP Custom Decryptor</h1>
        <div class="upload" onclick="document.getElementById('fileIn').click()">
            Click or drag your .hc file here
            <input type="file" id="fileIn" accept=".hc">
            <div class="fname" id="fName"></div>
        </div>
        <button id="decBtn" onclick="doDecrypt()" disabled>Decrypt</button>
        <div id="status" class="err"></div>
        <div id="outBox" class="result hidden"></div>
        <button class="logout" onclick="logout()">Logout</button>
    </div>
</div>

<script>
let selFile = null;

window.onload = () => {
    if(localStorage.getItem('auth_ok') === 'yes') showMain();
};

function showMain() {
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('mainCard').classList.remove('hidden');
}
function showLogin() {
    document.getElementById('mainCard').classList.add('hidden');
    document.getElementById('loginCard').classList.remove('hidden');
    localStorage.removeItem('auth_ok');
}

async function doLogin() {
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value.trim();
    const e = document.getElementById('errMsg');
    e.textContent = '';
    if(!u || !p) { e.textContent = 'Fill both fields'; return; }
    try {
        const r = await fetch('/api/login', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({username:u, password:p})
        });
        const d = await r.json();
        if(d.ok) {
            localStorage.setItem('auth_ok','yes');
            showMain();
        } else {
            e.textContent = d.msg || 'Login failed';
        }
    } catch {
        e.textContent = 'Server not running — start app.py first';
    }
}

document.getElementById('fileIn').onchange = ev => {
    selFile = ev.target.files[0];
    document.getElementById('fName').textContent = selFile ? `Selected: ${selFile.name}` : '';
    document.getElementById('decBtn').disabled = !selFile;
};

async function doDecrypt() {
    if(!selFile) return;
    const s = document.getElementById('status');
    const o = document.getElementById('outBox');
    const b = document.getElementById('decBtn');
    s.textContent = ''; o.classList.add('hidden');
    b.disabled = true; b.textContent = 'Processing...';

    const fd = new FormData(); fd.append('file', selFile);
    try {
        const r = await fetch('/api/decrypt', {method:'POST', body:fd});
        const d = await r.json();
        if(d.ok) {
            o.textContent = d.data;
            o.classList.remove('hidden');
        } else {
            s.textContent = d.err || 'Error';
        }
    } catch {
        s.textContent = 'Connection error';
    } finally {
        b.disabled = false; b.textContent = 'Decrypt';
    }
}

function logout() {
    showLogin();
    document.getElementById('user').value = '';
    document.getElementById('pass').value = '';
    selFile = null;
    document.getElementById('fName').textContent = '';
    document.getElementById('outBox').classList.add('hidden');
}

document.getElementById('pass').addEventListener('keydown', e=>{
    if(e.key==='Enter') doLogin();
});
</script>
</body>
</html>
